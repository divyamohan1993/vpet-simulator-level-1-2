name: Test and deploy to Cloud Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vpet-level-2-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Validate simulator
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Validate source and test structure
        run: npm run check

      - name: Build production container
        run: docker build --tag vpet-simulator:${{ github.sha }} .

      - name: Smoke-test production container
        run: |
          docker run --detach --rm --name vpet-smoke --publish 8080:8080 vpet-simulator:${{ github.sha }}
          trap 'docker stop vpet-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs vpet-smoke
          exit 1

  deploy:
    name: Deploy asia-east1 production
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    env:
      REGION: asia-east1
      SERVICE: vpet-simulator-level-1-2
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT || secrets.GCP_SERVICE_ACCOUNT }}
      GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GCP_PROJECT_ID}" ]]; then
            echo "::error::Set GCP_PROJECT_ID as a repository variable or secret."
            exit 1
          fi

          if [[ -n "${GCP_WIF_PROVIDER}" && -n "${GCP_SERVICE_ACCOUNT}" ]]; then
            echo "Authentication mode: Workload Identity Federation"
          elif [[ -n "${GCP_CREDENTIALS_JSON}" ]]; then
            echo "Authentication mode: service-account JSON fallback"
          else
            echo "::error::Configure GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT, or set GCP_CREDENTIALS_JSON."
            exit 1
          fi

      - name: Authenticate with Workload Identity Federation
        if: env.GCP_WIF_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate with service-account JSON
        if: ${{ !(env.GCP_WIF_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '') && env.GCP_CREDENTIALS_JSON != '' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          credentials_json: ${{ env.GCP_CREDENTIALS_JSON }}

      - name: Deploy source to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          source: .
          flags: >-
            --allow-unauthenticated
            --port=8080
            --cpu=1
            --memory=512Mi
            --min-instances=0
            --max-instances=20
            --concurrency=80
            --timeout=300s
          env_vars: |
            APP_VERSION=${{ github.sha }}
          revision_traffic: LATEST=100

      - name: Verify deployed service
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          test -n "${SERVICE_URL}"
          curl --retry 8 --retry-delay 3 --retry-all-errors --fail --silent --show-error "${SERVICE_URL}/healthz"
          curl --retry 8 --retry-delay 3 --retry-all-errors --fail --silent --show-error "${SERVICE_URL}/" | grep -q "VPET Level 2"

      - name: Publish deployment summary
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "## VPET Level 2 production deployment"
            echo ""
            echo "- Region: \`${REGION}\`"
            echo "- Service: \`${SERVICE}\`"
            echo "- Revision source: \`${GITHUB_SHA}\`"
            echo "- URL: ${SERVICE_URL}"
            echo "- Health check: passed"
          } >> "${GITHUB_STEP_SUMMARY}"
